worker_processes auto;
events {}

http {
    sendfile on;

    server {
        listen 8080;

        location / {
            root /app/streams;
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
    }
}
