worker_processes auto;

events {}

http {
    server {
        listen 80;

        location / {
            root /app;
            autoindex on;
        }

        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /app;
            add_header Cache-Control no-cache;
        }
    }
}
