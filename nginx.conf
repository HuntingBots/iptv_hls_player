user root;

worker_processes auto;

events {}

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;

    server {
        listen 8080;
        server_name _;

        # VERY IMPORTANT
        root /streams;

        location / {
            autoindex on;

            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin *;

            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
        }
    }
}
